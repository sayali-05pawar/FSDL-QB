<!-- 24. Build an Image Gallery with Category Filtering using HTML, CSS, and JavaScript. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<h2>Image Gallery</h2>

<!-- Filter Buttons -->
<button onclick="filterImages('all')">All</button>
<button onclick="filterImages('nature')">Nature</button>
<button onclick="filterImages('animals')">Animals</button>

<!-- Gallery -->
<div class="gallery">

    <img src="https://via.placeholder.com/150" class="item nature">
    <img src="https://via.placeholder.com/150" class="item nature">
    <img src="https://via.placeholder.com/150" class="item animals">
    <img src="https://via.placeholder.com/150" class="item animals">
    <img src="https://via.placeholder.com/150" class="item nature">
    <img src="https://via.placeholder.com/150" class="item animals">

</div>

</body>
</html>
