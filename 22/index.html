<!-- 22. Design a Blog Layout consisting of header, sidebar, content area, and footer using CSS
layout techniques. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header -->
<header class="header">
    <h1>My Blog</h1>
</header>

<!-- Main Layout -->
<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h3>Sidebar</h3>
        <p>Links / Categories</p>
    </aside>

    <!-- Content -->
    <main class="content">
        <h2>Blog Post</h2>
        <p>This is the main content area.</p>
    </main>

</div>

<!-- Footer -->
<footer class="footer">
    <p>© 2026 My Blog</p>
</footer>

</body>
</html>
