<!-- 2. Design a reusable Skill Bar Component that accepts skill name and proficiency percentage as
input and visually represents it. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skill Bar Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Skills</h1>

    <!-- Skill Bars -->
    <div class="skill-container" data-skill="HTML" data-percent="90"></div>
    <div class="skill-container" data-skill="CSS" data-percent="80"></div>
    <div class="skill-container" data-skill="JavaScript" data-percent="75"></div>
    <div class="skill-container" data-skill="Python" data-percent="85"></div>

    <script src="script.js"></script>

</body>
</html>
