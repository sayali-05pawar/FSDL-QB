<!-- 10. Develop an FAQ Accordion where clicking a question expands/collapses the answer section. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FAQ Accordion</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<h2>FAQ</h2>

<div class="faq">
    <div class="question">What is HTML?</div>
    <div class="answer">HTML is used to structure web pages.</div>
</div>

<div class="faq">
    <div class="question">What is CSS?</div>
    <div class="answer">CSS is used for styling web pages.</div>
</div>

<div class="faq">
    <div class="question">What is JavaScript?</div>
    <div class="answer">JavaScript adds interactivity to websites.</div>
</div>

</body>
</html>
