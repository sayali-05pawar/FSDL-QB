<!-- 17. Develop a Product Filtering System that filters items based on category selection. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Filter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<h2>Product Filter</h2>

<!-- Filter Buttons -->
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('electronics')">Electronics</button>
<button onclick="filterProducts('clothing')">Clothing</button>

<!-- Products -->
<div id="products">

    <div class="item electronics">Phone</div>
    <div class="item electronics">Laptop</div>
    <div class="item clothing">Shirt</div>
    <div class="item clothing">Jeans</div>

</div>

</body>
</html>
